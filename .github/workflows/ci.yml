name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Lint SCSS and tooling
        run: npm run lint
      - name: Type-check tooling (tsc --checkJs)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build dist/
        run: npm run build
      - name: Zero-JavaScript check on dist/
        run: npm run check:dist
      - name: Validate HTML
        run: npm run lint:html
