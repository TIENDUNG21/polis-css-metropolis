<!-- Roads and traffic. All routes share one 24 s period; a car's delay is
     minus its phase. Avenue A cars cross the junction in the first half of
     the cycle, avenue B cars in the second (see scss/systems/traffic). -->

<div class="road road--b"></div>
<div class="junction"></div>
<polis-car route="a-east" delay="-0.6" paint="#c9a227"/>

<polis-car route="a-east" delay="-4" paint="#b84a35"/>
<polis-car route="a-east" delay="-5.5" paint="#4f6d8a"/>
<polis-car route="a-west" delay="-7.4" paint="#e8e3d6"/>
<polis-car route="a-west" delay="-9.4" paint="#3e4a52"/>
<polis-car route="a-west" delay="-11.6" paint="#ff9e64"/>
<polis-car route="a-west" delay="-14.4" paint="#6f8f5a"/>
<polis-car route="b-south" delay="-14.6" paint="#d8d2c4"/>
<polis-car route="b-south" delay="-17.6" paint="#a63d32"/>
<polis-car route="b-south" delay="-20.6" paint="#c9a227"/>
