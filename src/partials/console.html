<section class="console" aria-label="City controls">
  <fieldset class="control">
    <legend class="control__legend">Time</legend>
    <div class="control__options">
      <label class="control__option"><input class="control__input" type="radio" name="time" value="auto" checked>Auto</label>
      <label class="control__option"><input class="control__input" type="radio" name="time" value="dawn">Dawn</label>
      <label class="control__option"><input class="control__input" type="radio" name="time" value="day">Day</label>
      <label class="control__option"><input class="control__input" type="radio" name="time" value="dusk">Dusk</label>
      <label class="control__option"><input class="control__input" type="radio" name="time" value="night">Night</label>
    </div>
  </fieldset>
  <fieldset class="control">
    <legend class="control__legend">Weather</legend>
    <div class="control__options">
      <label class="control__option"><input class="control__input" type="radio" name="weather" value="clear" checked>Clear</label>
      <label class="control__option"><input class="control__input" type="radio" name="weather" value="rain">Rain</label>
      <label class="control__option"><input class="control__input" type="radio" name="weather" value="snow">Snow</label>
      <label class="control__option"><input class="control__input" type="radio" name="weather" value="fog">Fog</label>
    </div>
  </fieldset>
  <fieldset class="control">
    <legend class="control__legend">Camera</legend>
    <div class="control__options">
      <label class="control__option"><input class="control__input" type="radio" name="camera" value="iso" checked>Isometric</label>
      <label class="control__option"><input class="control__input" type="radio" name="camera" value="aerial">Aerial</label>
      <label class="control__option"><input class="control__input" type="radio" name="camera" value="street">Street</label>
      <label class="control__option"><input class="control__input" type="radio" name="camera" value="river">Riverside</label>
      <label class="control__option"><input class="control__input" type="radio" name="camera" value="plan">Plan</label>
    </div>
  </fieldset>
  <fieldset class="control">
    <legend class="control__legend">Motion</legend>
    <div class="control__options">
      <label class="control__option"><input class="control__input" type="radio" name="motion" value="live" checked>Live</label>
      <label class="control__option"><input class="control__input" type="radio" name="motion" value="paused">Paused</label>
    </div>
  </fieldset>
</section>
